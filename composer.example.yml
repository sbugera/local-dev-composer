# ============================================================
# composer.yml — example configuration for local-dev-composer
# Copy this to composer.yml and adapt to your project.
# ============================================================

workspace:
  root: ./repos             # All repos are cloned here unless 'dir' is set per-service
  log_dir: ./logs           # Per-service log files land here
  workers: 4                # Max parallel threads for clone / install / up (default: 4)

# ============================================================
# Services
# ============================================================
services:

  # ---- Infrastructure (external — not cloned, just waited on) ----

  postgres:
    runtime: external
    description: "Local PostgreSQL database"
    start:
      command: "net start postgresql-x64-14"
    health_check:
      type: tcp
      host: localhost
      port: 5432
      timeout: 30
      interval: 3

  # ---- Config Server (must start before any Spring Boot app) ----

  config-server:
    repo: https://github.com/your-org/config-server.git
    branch: main
    runtime: java
    description: "Spring Cloud Config Server"
    depends_on: []
    env:
      SERVER_PORT: "8888"
      SPRING_PROFILES_ACTIVE: native,local
      # Per-service env — same variable name can have different values
      # in different services (e.g. DATABASE_URL below)
    env_files:                       # merged in order; last wins
      - .env.base
      - .env.config-server
    requires:
      java: ">=17"
      commands: [mvn]
      folders:
        - C:/data/config-server
    install:
      command: mvn clean package -DskipTests -q
      working_dir: .
    start:
      command: java -jar target/config-server.jar
      working_dir: .
    health_check:
      type: http
      url: http://localhost:8888/actuator/health
      timeout: 60
      interval: 5

  # ---- Gateway ----

  gateway:
    repo: https://github.com/your-org/gateway.git
    branch: main
    runtime: java
    description: "API Gateway"
    depends_on:
      - postgres
      - config-server
    env:
      SERVER_PORT: "8080"
      DATABASE_URL: jdbc:postgresql://localhost:5432/gateway_db
      SPRING_PROFILES_ACTIVE: local
      CONFIG_SERVER_URL: http://localhost:8888
      JAVA_HOME: "C:/dev/jdks/ms-17.0.10"   # override to use a specific JDK
    path_dirs:
      - "${JAVA_HOME}/bin"                    # prepend to PATH so 'java' resolves correctly
    requires:
      java: ">=17"
      commands: [mvn]
      env_vars: [JAVA_HOME]
      ports_free: [8080]
    install:
      command: mvn clean package -DskipTests -q
    start:
      command: java -jar target/gateway.jar
    health_check:
      type: http
      url: http://localhost:8080/actuator/health
      timeout: 90
      interval: 5

  # ---- User Service (Python / FastAPI) ----

  user-service:
    repo: https://github.com/your-org/user-service.git
    branch: develop
    runtime: python
    description: "User management microservice"
    depends_on:
      - postgres
      - config-server
    env:
      DATABASE_URL: postgresql://localhost:5432/users_db   # different DB from gateway!
      APP_PORT: "8001"
      LOG_LEVEL: DEBUG
    requires:
      python: ">=3.9"
      commands: [pip]
      ports_free: [8001]
      folders:
        - C:/data/user-service/uploads
    install:
      command: "python -m venv .venv && call .venv\\Scripts\\activate.bat && pip install -r requirements.txt --quiet"
    start:
      command: "call .venv\\Scripts\\activate.bat && python -m uvicorn app.main:app --host 0.0.0.0 --port 8001"
    health_check:
      type: http
      url: http://localhost:8001/health
      timeout: 60
      interval: 5

  # ---- Notification Service (Node.js) ----

  notification-service:
    repo: https://github.com/your-org/notification-service.git
    runtime: node
    description: "Email/SMS notifications"
    depends_on:
      - postgres
    env:
      PORT: "8002"
      DATABASE_URL: postgresql://localhost:5432/notifications_db
      SMTP_HOST: localhost
      SMTP_PORT: "1025"
    requires:
      node: ">=18"
      commands: [npm]
      ports_free: [8002]
    install:
      command: npm install --silent
    start:
      command: node dist/server.js
    health_check:
      type: http
      url: http://localhost:8002/health
      timeout: 45

# ============================================================
# Groups — named sets for quick selection
# ============================================================
groups:

  # Use this when working on the gateway only
  gateway-dev:
    description: "Minimum dependencies to develop the gateway"
    services:
      - postgres
      - config-server
      - gateway

  # Use this when working on user-service
  user-dev:
    description: "Minimum dependencies to develop user-service"
    services:
      - postgres
      - config-server
      - user-service

  # Full stack
  all:
    description: "All services"
    services:
      - postgres
      - config-server
      - gateway
      - user-service
      - notification-service
